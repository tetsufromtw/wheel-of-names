<div class="brutal-wheel" [style.transform]="'rotate(' + rotation + 'deg)'">
  <svg width="400" height="400" class="brutal-wheel-svg">
    @for (section of sections; track $index) {
      <g>
        <path 
          [attr.d]="getSectionPath($index)"
          class="brutal-section-path"
          [class.brutal-highlight]="highlightIndex === $index"
          [style.fill]="getSectionColor($index)">
        </path>
        <text 
          [attr.x]="getSectionTextX($index)"
          [attr.y]="getSectionTextY($index)"
          [attr.transform]="getSectionTextTransform($index)"
          class="brutal-section-text">
          {{ section }}
        </text>
      </g>
    }
  </svg>
</div>
