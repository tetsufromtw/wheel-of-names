<div class="brutal-selector-grid">
  @for (section of sections; track $index) {
    <div 
      class="brutal-section-block"
      [class.brutal-current]="currentIndex === $index"
      [style.background]="getSectionColor($index)">
      <span class="brutal-section-text">{{ section }}</span>
    </div>
  }
</div>
