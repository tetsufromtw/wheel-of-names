<div class="brutal-container">
  <div class="brutal-wrapper">
    <!-- Triangle indicator -->
    <div class="brutal-indicator"></div>
    
    <!-- Wheel renderer -->
    <app-brutal-wheel-renderer
      [sections]="sections()"
      [rotation]="rotation()"
      [highlightIndex]="highlightIndex()">
    </app-brutal-wheel-renderer>
    
    <!-- Center GO button -->
    <button 
      class="brutal-go-button" 
      [disabled]="isSpinning()"
      (click)="onGoClick()">
      {{ isSpinning() ? 'スピン中' : 'GO' }}
    </button>
  </div>
  
  <!-- Control buttons -->
  <app-brutal-controls
    [isSpinning]="isSpinning()"
    [sectionCount]="sections().length"
    [minSections]="2"
    (showAddModal)="onShowAddModal()"
    (showRemoveModal)="onShowRemoveModal()">
  </app-brutal-controls>
  
  <!-- Modal -->
  <app-brutal-modal
    [isOpen]="showModal()"
    [type]="modalType()"
    [currentSectionCount]="sections().length"
    (confirm)="onModalConfirm()"
    (cancel)="onModalCancel()">
  </app-brutal-modal>
</div>
