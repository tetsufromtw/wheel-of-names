<div class="wheel-container">
  <div class="wheel-wrapper">
    <!-- Triangle indicator -->
    <div class="triangle-indicator"></div>
    
    <!-- Wheel renderer -->
    <app-wheel-renderer
      [sections]="sections()"
      [rotation]="rotation()"
      [highlightIndex]="highlightIndex()">
    </app-wheel-renderer>
    
    <!-- Center GO button -->
    <button 
      class="go-button" 
      [disabled]="isSpinning()"
      (click)="onGoClick()">
      {{ isSpinning() ? 'スピン中' : 'GO' }}
    </button>
  </div>
  
  <!-- Control buttons -->
  <app-wheel-controls
    [isSpinning]="isSpinning()"
    [sectionCount]="sections().length"
    [minSections]="2"
    (addSection)="onAddSection()"
    (removeSection)="onRemoveSection()">
  </app-wheel-controls>
</div>
